name: Deploy API to Scaleway Registry

on:
  push:
    branches:
      - main
    # Ne déclencher le build que si les fichiers du serveur ou du workflow changent
    paths:
      - 'server/**'
      - '.github/workflows/deploy-scaleway.yml'
  # Permet de lancer le workflow manuellement depuis GitHub
  workflow_dispatch: 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        
      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Connexion au Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          # Le registre par défaut est Paris. Modifiez 'fr-par' si vous êtes sur 'nl-ams' ou 'pl-waw'
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
          
      - name: Build et Push de l'image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          # Remplacez "VOTRE_NAMESPACE" par le nom de votre namespace Scaleway
          tags: rg.fr-par.scw.cloud/nitatemic/framesnap-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
